name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'bootstrap.py'
      - 'london-atlas-*.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore bundled libraries and model downloads
        run: python bootstrap.py
      - name: Verify browser libraries
        run: |
          test -s dist/vendor/three.module.js
          test -s dist/vendor/three.core.js
          test -s dist/assets/city.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static atlas
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
